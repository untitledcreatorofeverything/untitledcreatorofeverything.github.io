<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Problem Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* Custom styling for inputs */
        select, textarea, button {
            border-radius: 0.5rem; /* rounded-lg */
            border: 1px solid #4B5563; /* border-gray-600 */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 p-4">

    <div class="w-full max-w-4xl bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-10 my-8">
        <h1 class="text-4xl font-extrabold text-center mb-2 text-purple-400">
            <span class="inline-block align-middle mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-400"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line></svg>
            </span>
            AI Math Problem Generator
        </h1>
        <p class="text-center text-gray-400 mb-8">Select your parameters and let the AI generate a unique challenge.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            
            <div class="flex flex-col">
                <label for="topic-select" class="mb-2 font-semibold text-gray-300">Math Topic</label>
                <select id="topic-select" class="p-3 bg-gray-700 text-gray-200 focus:ring-purple-500 focus:border-purple-500 transition duration-150">
                    <option value="Arithmetic">Arithmetic (Addition, Subtraction, etc.)</option>
                    <option value="Algebra">Algebra (Equations, Variables, Functions)</option>
                    <option value="Geometry">Geometry (Shapes, Area, Volume)</option>
                    <option value="Calculus">Calculus (Derivatives, Integrals, Limits)</option>
                    <option value="Statistics">Statistics & Probability</option>
                    <option value="Logic Puzzles">Logic/Critical Thinking Puzzles</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label for="difficulty-select" class="mb-2 font-semibold text-gray-300">Difficulty / Grade Level</label>
                <select id="difficulty-select" class="p-3 bg-gray-700 text-gray-200 focus:ring-purple-500 focus:border-purple-500 transition duration-150">
                    <option value="Kindergarten">Kindergarten (Ages 5-6)</option>
                    <option value="Grade 3">Grade 3 (Ages 8-9)</option>
                    <option value="Grade 6">Grade 6 (Ages 11-12)</option>
                    <option value="Grade 9">Grade 9 (Ages 14-15)</option>
                    <option value="Grade 12">Grade 12 (Ages 17-18)</option>
                    <option value="College Level">College Level (Advanced)</option>
                </select>
            </div>
        </div>

        <div class="mb-8">
            <label for="custom-input" class="mb-2 font-semibold text-gray-300 block">Custom Request (Optional)</label>
            <textarea id="custom-input" rows="3" placeholder="e.g., Make it about space travel and involve money."
                      class="w-full p-3 bg-gray-700 text-gray-200 focus:ring-purple-500 focus:border-purple-500 transition duration-150"></textarea>
        </div>

        <button id="generate-btn" onclick="generateProblem()"
                class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xl rounded-lg shadow-md transition duration-200 disabled:opacity-50">
            Generate New Problem
        </button>

        <div id="problem-output" class="mt-8 min-h-[150px] bg-gray-700/50 rounded-lg p-0 text-center flex items-center justify-center text-gray-400 italic border border-gray-700">
            <p>Your generated math problem will appear here.</p>
        </div>
    </div>

    <script>
        // --- API Utility Functions (Exponential Backoff) ---

        /**
         * Simple delay function for retries.
         * @param {number} ms - Milliseconds to wait.
         * @returns {Promise<void>}
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /**
         * Fetches data with exponential backoff on failure or rate limiting (429).
         * @param {string} url - The API endpoint URL.
         * @param {Object} options - Fetch options (method, headers, body).
         * @param {number} maxRetries - Maximum number of retries.
         * @returns {Promise<Response>}
         */
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status === 429) {
                        // Rate limit exceeded, retry with exponential backoff
                        const backoffTime = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        await delay(backoffTime);
                        continue;
                    }
                    if (!response.ok) {
                        const errorBody = await response.text();
                        throw new Error(`HTTP error! Status: ${response.status}. Body: ${errorBody.substring(0, 100)}...`);
                    }
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error;
                    }
                    // Other network errors, wait and retry
                    const backoffTime = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await delay(backoffTime);
                }
            }
        }


        // --- Main Problem Generation Logic ---

        async function generateProblem() {
            const topic = document.getElementById('topic-select').value;
            const difficulty = document.getElementById('difficulty-select').value;
            const customInput = document.getElementById('custom-input').value.trim();

            const outputDiv = document.getElementById('problem-output');
            const generateButton = document.getElementById('generate-btn');

            // Show loading state
            outputDiv.innerHTML = `
                <div class="text-center py-6 text-purple-400 flex items-center justify-center space-x-2">
                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Generating problem... (This may take a moment)</span>
                </div>`;
            generateButton.disabled = true;

            try {
                // The API Key is automatically supplied in this execution environment
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                // 1. System Instruction: Define the AI's role and output format
                const systemPrompt = `You are a helpful and creative math problem generator. Your goal is to create a single, unique, and challenging math problem based on the user's specifications. The final output must be only the math problem, formatted using LaTeX markdown for clarity. Use inline math delimiters ($...$) for simple variables and numbers, and display math delimiters ($$...$$) for complex equations, matrices, or final questions. DO NOT include the answer, solution, or any preamble/postamble text like 'Here is your problem:'`;

                // 2. User Query: The specific request based on user inputs
                const userQuery = `Generate a math problem.
                - Topic: ${topic}
                - Difficulty/Grade Level: ${difficulty}
                - User Custom Request: ${customInput || 'None specified. Be creative and make it a real-world word problem.'}
                
                The problem must be a single, challenging question ready to be solved.`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                };

                // Make the API call with retry logic
                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (generatedText) {
                    let formattedText = generatedText.trim();
                    
                    // Cleanup step: Remove the unwanted \text{problem} tag globally and case-insensitively
                    formattedText = formattedText.replace(/\\text{problem}/gi, '').trim(); 
                    
                    // Basic Markdown to HTML conversion for display in the simple DOM
                    
                    // 1. Handle display math (must be first)
                    // Replaces $$ content $$ with a styled block
                    formattedText = formattedText.replace(/\$\$(.*?)\$\$/gs, (match, p1) => {
                        const content = p1.trim().replace(/\n/g, ' ');
                        return `<div class="math-block text-2xl font-mono p-4 my-4 bg-gray-700 rounded-lg overflow-x-auto text-yellow-300">${content}</div>`;
                    });
                    
                    // 2. Handle inline math
                    // Replaces $ content $ with a styled span
                    formattedText = formattedText.replace(/\$(.*?)\$/g, (match, p1) => {
                        const content = p1.trim();
                        return `<span class="math-inline font-mono bg-gray-700/80 px-1 py-0.5 rounded text-yellow-300">${content}</span>`;
                    });

                    // 3. Convert markdown (e.g., **bold**) to HTML
                    formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    // 4. Convert newlines to breaks
                    formattedText = formattedText.replace(/\n/g, '<br>');
                    
                    outputDiv.innerHTML = `<div class="text-left text-lg p-6">${formattedText}</div>`;
                    outputDiv.classList.add('border-purple-500/50', 'border-2'); // Highlight success
                    
                } else {
                    // Handle cases where AI returns no text or safety filters apply
                    const safetyReason = result.candidates?.[0]?.finishReason;
                    outputDiv.innerHTML = `<div class="text-red-400 p-4">Error generating problem. Reason: ${safetyReason || 'Unknown API Error.'} Please adjust your custom request and try again.</div>`;
                }

            } catch (error) {
                console.error("API Error:", error);
                outputDiv.innerHTML = `<div class="text-red-400 p-4">An unexpected error occurred: ${error.message}. Please check your connection and try again later.</div>`;
            } finally {
                generateButton.disabled = false;
                outputDiv.classList.remove('items-center', 'justify-center', 'italic', 'text-gray-400');
            }
        }
    </script>
</body>
</html>
