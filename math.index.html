<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Master - Untitled Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="absolute top-4 left-4">
        <a href="/projects" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left"></i> Projects</a>
    </div>

    <div class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="p-8 text-center border-b border-slate-700">
            <h1 class="text-3xl font-bold text-white mb-2">Algebra Master</h1>
            <div class="flex justify-center gap-2 mt-4">
                <button onclick="setDiff('easy')" id="btn-easy" class="px-4 py-2 rounded bg-purple-600 text-white font-bold">Easy</button>
                <button onclick="setDiff('medium')" id="btn-medium" class="px-4 py-2 rounded bg-slate-700 text-slate-300">Medium</button>
                <button onclick="setDiff('hard')" id="btn-hard" class="px-4 py-2 rounded bg-slate-700 text-slate-300">Hard</button>
            </div>
        </div>
        
        <div class="p-12 text-center bg-slate-900/50">
            <div id="problem" class="text-4xl md:text-6xl font-mono font-bold text-white mb-10">...</div>
            
            <div class="flex justify-center gap-4">
                <button onclick="gen()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition shadow-lg shadow-blue-500/20">New Problem</button>
                <button onclick="toggle()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">Show Solution</button>
            </div>
        </div>

        <div id="solution" class="hidden p-8 bg-slate-950 border-t border-slate-700">
            <h3 class="text-purple-400 font-bold mb-4">Solution Steps:</h3>
            <div id="steps" class="font-mono text-slate-300 space-y-2"></div>
        </div>
    </div>

    <script>
        let diff = 'easy';
        function setDiff(d) {
            diff = d;
            ['easy','medium','hard'].forEach(l => {
                const b = document.getElementById(`btn-${l}`);
                if(l===d) { b.classList.add('bg-purple-600','text-white'); b.classList.remove('bg-slate-700','text-slate-300'); }
                else { b.classList.remove('bg-purple-600','text-white'); b.classList.add('bg-slate-700','text-slate-300'); }
            });
            gen();
        }
        function toggle() { document.getElementById('solution').classList.toggle('hidden'); }
        function gen() {
            document.getElementById('solution').classList.add('hidden');
            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const nz = (min, max) => { let r=0; while(r===0) r=rnd(min,max); return r; }
            let p="", s="";

            if(diff === 'easy') {
                let x = rnd(-10,10), a = nz(-9,9), b = nz(-20,20), c = a*x+b;
                p = `${a}x ${b<0?'-':'+'} ${Math.abs(b)} = ${c}`;
                s = `<p>1. ${b>0?'Subtract':'Add'} ${Math.abs(b)} from both sides → ${a}x = ${c-b}</p><p>2. Divide by ${a} → x = ${(c-b)/a}</p>`;
            } else if (diff === 'medium') {
                let m=nz(-9,9), n=nz(-9,9), b=m+n, c=m*n;
                p = `x² ${b>=0?'+':'-'} ${Math.abs(b)}x ${c>=0?'+':'-'} ${Math.abs(c)} = 0`;
                s = `<p>Factor pairs of ${c} that sum to ${b} are ${m}, ${n}.</p><p>(x + ${m})(x + ${n}) = 0</p><p>x = ${-m}, x = ${-n}</p>`;
            } else {
                let x=rnd(-5,5), y=rnd(-5,5), a=nz(1,5), b=nz(1,5), d=nz(1,3), e=nz(-3,-1);
                p = `<div>${a}x + ${b}y = ${a*x+b*y}</div><div>${d}x ${e<0?'-':'+'} ${Math.abs(e)}y = ${d*x+e*y}</div>`;
                s = `<p>System of Equations.</p><p>Answer: x = ${x}, y = ${y}</p>`;
            }
            document.getElementById('problem').innerHTML = p;
            document.getElementById('steps').innerHTML = s;
        }
        gen();
    </script>
</body>
</html>
