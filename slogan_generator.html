        // --- 2. Seeded Random Number Generator (PRNG) ---
        // Global variable for the seed used by the generator
        let currentSeed = 123; 

        /**
         * Sets the seed for the PRNG based on the user's input.
         * @param {string|number} newSeed - The user-provided seed value.
         */
        function setSeed(newSeed) {
            let parsedSeed = parseInt(newSeed, 10);
            
            // Fallback to 1 if input is invalid or 0
            currentSeed = (isNaN(parsedSeed) || parsedSeed <= 0) ? 1 : parsedSeed;
        }

        /**
         * Pseudorandom number generator (PRNG) function using a simple LCG.
         * This returns a number between 0 (inclusive) and 1 (exclusive).
         */
        function seededRandom() {
            // LCG parameters: a=9301, c=49297, m=233280
            // These parameters are standard for simple, predictable PRNGs.
            currentSeed = (currentSeed * 9301 + 49297) % 233280;
            return currentSeed / 233280;
        }

        // --- 3. Core Application Logic ---
        
        /**
         * Selects 3 unique slogans based on the user's selected type and seed.
         */
        function generateSlogans() {
            const sloganType = document.getElementById('slogan-type').value;
            const seedInput = document.getElementById('seed-input').value;
            const outputDiv = document.getElementById('slogan-output');
            const downloadBtn = document.getElementById('download-btn');
            const slogansList = SLOGAN_DATABASE[sloganType];

            // 1. Set the seed before starting the generation
            setSeed(seedInput);
            
            if (!slogansList || slogansList.length === 0) {
                outputDiv.innerHTML = '<p class="text-red-400">Error: No slogans found for this category.</p>';
                downloadBtn.disabled = true;
                return;
            }

            // 2. Randomly select 3 unique indices using the seeded PRNG
            const uniqueIndices = new Set();
            while (uniqueIndices.size < 3 && uniqueIndices.size < slogansList.length) {
                // Use the seededRandom() function to get a reproducible index
                const randomIndex = Math.floor(seededRandom() * slogansList.length);
                uniqueIndices.add(randomIndex);
            }

            // 3. Map indices back to slogans
            const selectedSlogans = Array.from(uniqueIndices).map(index => slogansList[index]);

            // 4. Format and display the output
            let htmlList = '<ul class="space-y-4 text-center text-xl font-medium">';
            selectedSlogans.forEach(slogan => {
                // Added a group for better hover effect on the copy-hint
                htmlList += `<li class="group p-4 bg-[#30363d]/50 rounded-lg shadow-inner hover:bg-[#30363d] transition duration-150 cursor-pointer relative" onclick="copyToClipboard(this)">
                                ${slogan}
                                <span class="copy-hint text-xs text-gray-400 block mt-1 transition duration-200 opacity-0 group-hover:opacity-100">Click to Copy</span>
                             </li>`;
            });
            htmlList += '</ul>';

            outputDiv.innerHTML = `<div class="w-full text-left text-lg">${htmlList}</div>`;
            outputDiv.classList.remove('text-gray-500', 'italic', 'justify-center', 'items-center');
            
            // 5. Enable the download button
            downloadBtn.disabled = false;
        }

        /**
         * Copies the slogan text to the user's clipboard.
         * @param {HTMLElement} element - The list item containing the slogan.
         */
        function copyToClipboard(element) {
            // Remove the 'Click to Copy' hint text before copying
            const hintSpan = element.querySelector('.copy-hint');
            const sloganText = element.innerText.replace(hintSpan.innerText, '').trim();
            
            // Use execCommand for broader compatibility in embedded contexts
            const tempInput = document.createElement('textarea');
            tempInput.value = sloganText;
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand('copy');
                // Give visual feedback
                element.style.backgroundColor = '#10B981'; /* Green-500 */
                element.style.color = '#fff';
                setTimeout(() => {
                    element.style.backgroundColor = ''; /* Revert background */
                    element.style.color = ''; /* Revert text color */
                }, 500);
            } catch (err) {
                console.error('Could not copy text: ', err);
            } finally {
                document.body.removeChild(tempInput);
            }
        }

        /**
         * Downloads the currently displayed slogans as a text file.
         */
        function downloadSlogans() {
            const slogans = document.querySelectorAll('#slogan-output li');
            if (slogans.length === 0) return;

            const sloganType = document.getElementById('slogan-type').value;
            
            // Map the list items to plain text, removing the copy hint
            const downloadContent = slogans.map((li, index) => {
                const text = li.innerText.replace('Click to Copy', '').trim();
                return `${index + 1}. ${text}`;
            }).join('\n');
            
            const filename = `${sloganType}_Slogans_Seed${document.getElementById('seed-input').value}.txt`;
            
            // Create a Blob and initiate download
            const blob = new Blob([downloadContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>
