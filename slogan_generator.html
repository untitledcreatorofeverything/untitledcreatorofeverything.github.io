<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Slogan Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #eef2ff; }
        .card { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        .btn-primary { transition: all 0.15s ease; }
        .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .loading-ring { border-color: #fff transparent transparent transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl bg-white rounded-xl p-6 md:p-10 card">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-6 text-center border-b pb-3 border-indigo-100">
            Intelligent Slogan Generator
        </h1>

        <!-- Input Form -->
        <div class="space-y-4">
            <!-- API Key Warning/Placeholder -->
            <div id="apiKeyWarning" class="p-3 bg-red-100 border border-red-300 text-red-700 rounded-lg text-sm hidden">
                ⚠️ **API Key Missing!** Please paste your Gemini API key into the `API_KEY` variable in the script section to run this externally.
            </div>

            <!-- Slogan Topic Input -->
            <div>
                <label for="sloganTopic" class="block text-sm font-medium text-gray-700 mb-1">Slogan Topic or Specific Request</label>
                <textarea id="sloganTopic" rows="3" placeholder="e.g., Slogan for a new electric bicycle that is fast and stylish, or, I need a tagline for a charity event helping local shelters."
                          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
            </div>

            <!-- Slogan Type Select -->
            <div>
                <label for="sloganType" class="block text-sm font-medium text-gray-700 mb-1">Slogan Style</label>
                <select id="sloganType" class="w-full p-3 bg-white border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="Punchy & Memorable">Punchy & Memorable (Short, impactful)</option>
                    <option value="Formal & Trustworthy">Formal & Trustworthy (Professional, reliable)</option>
                    <option value="Witty & Humorous">Witty & Humorous (Clever, funny)</option>
                    <option value="Action-Oriented">Action-Oriented (Uses verbs, motivational)</option>
                    <option value="Luxury & Exclusive">Luxury & Exclusive (Premium feel)</option>
                </select>
            </div>

            <!-- Generation Button -->
            <button id="generateBtn" class="w-full btn-primary bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-300 flex items-center justify-center">
                <span id="buttonText">Generate 5 Slogans</span>
                <div id="loadingSpinner" class="hidden w-5 h-5 border-4 border-white border-solid rounded-full loading-ring ml-3"></div>
            </button>
        </div>

        <!-- Output Display -->
        <div class="mt-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Generated Slogans</h2>
            <div id="sloganOutput" class="p-6 bg-gray-50 border border-gray-200 rounded-lg min-h-[150px] space-y-3">
                <p class="text-gray-500 italic text-center pt-8">Your creative slogans will appear here after generation.</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const D = document;
            const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            
            // =========================================================================
            //  --- API KEY CONFIGURATION ---
            //  When running this file outside of the Canvas environment (e.g., locally 
            //  or on GitHub Pages), you MUST paste your Gemini API key below.
            // =========================================================================
            const API_KEY = "AIzaSyA9hc34gEh_1wdLj4AJfvUKdByNx7PoZw4"; // <--- PASTE YOUR GEMINI API KEY HERE
            
            const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
            // =========================================================================

            // --- UI Elements ---
            const sloganTopicEl = D.getElementById('sloganTopic'); // Changed ID reference
            const sloganTypeEl = D.getElementById('sloganType');
            const generateBtn = D.getElementById('generateBtn');
            const buttonTextEl = D.getElementById('buttonText');
            const loadingSpinnerEl = D.getElementById('loadingSpinner');
            const sloganOutputEl = D.getElementById('sloganOutput');
            const apiKeyWarningEl = D.getElementById('apiKeyWarning');

            // Show API key warning if running outside Canvas and key is missing
            if (API_KEY === "" && typeof __initial_auth_token === 'undefined') {
                apiKeyWarningEl.classList.remove('hidden');
            }


            // --- API UTILITY (Exponential Backoff) ---
            async function retryFetchWithBackoff(url, options, maxRetries = 5) {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (response.ok) {
                            return await response.json();
                        }
                        
                        // Handle 429 Rate Limit or 500/503 errors with retries
                        if (response.status === 429 || response.status >= 500) {
                            if (i === maxRetries - 1) throw new Error(`API failed after ${maxRetries} retries.`);
                            const delay = Math.pow(2, i) * 1000 + randInt(0, 1000); // 1s, 2s, 4s, ... + jitter
                            await new Promise(resolve => setTimeout(resolve, delay));
                        } else {
                            const errorText = await response.text();
                            throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                        }
                    } catch (error) {
                        if (i === maxRetries - 1) throw error;
                        const delay = Math.pow(2, i) * 1000 + randInt(0, 1000);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            
            // --- Generation Logic ---
            async function generateSlogans() {
                const sloganTopic = sloganTopicEl.value.trim(); // Changed variable name and source
                const sloganType = sloganTypeEl.value;

                if (!sloganTopic) { // Check against the new variable
                    sloganOutputEl.innerHTML = '<p class="text-red-500 text-center pt-8 font-semibold">Please enter a topic or request for the slogan first!</p>';
                    return;
                }
                
                // Final check for external API key before calling
                if (API_KEY === "" && typeof __initial_auth_token === 'undefined') {
                    sloganOutputEl.innerHTML = '<p class="text-red-500 text-center pt-8 font-semibold">API Key is missing. Check the script section!</p>';
                    apiKeyWarningEl.classList.remove('hidden');
                    return;
                }


                // Set Loading State
                generateBtn.disabled = true;
                buttonTextEl.textContent = 'Generating...';
                loadingSpinnerEl.classList.remove('hidden');
                sloganOutputEl.innerHTML = '<p class="text-center text-indigo-600 font-semibold pt-8">Thinking up catchy phrases...</p>';


                try {
                    const systemPrompt = `You are a creative marketing expert. Your job is to generate 5 distinctive and professional slogans based on the user's input. The slogans must be in the requested style. Provide the output as an unnumbered, single-line list, with each slogan separated by the '|' pipe character. Do not include any introductory or concluding text, just the slogans.`;
                    
                    const userQuery = `Slogan Topic/Request: "${sloganTopic}". Style: ${sloganType}. Generate 5 unique slogans.`; // Updated prompt
                    
                    const payload = {
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    };

                    const result = await retryFetchWithBackoff(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "Error: Could not retrieve slogans.";
                    
                    // Parse the raw text into slogans (assuming pipe separation)
                    const slogans = rawText.split('|').map(s => s.trim()).filter(s => s.length > 0);

                    if (slogans.length === 0) {
                         sloganOutputEl.innerHTML = `<p class="text-red-500 text-center pt-8 font-semibold">The API returned an unexpected format. Please try again.</p><p class="text-sm text-gray-500 text-center mt-2">Raw response: ${rawText}</p>`;
                    } else {
                        // Display the slogans as a styled list
                        let htmlList = '<ul class="list-disc list-inside space-y-2 text-gray-700">';
                        slogans.forEach((slogan, index) => {
                            htmlList += `<li class="pl-2"><strong class="text-indigo-600">${index + 1}.</strong> ${slogan}</li>`;
                        });
                        htmlList += '</ul>';
                        sloganOutputEl.innerHTML = htmlList;
                    }

                } catch (error) {
                    console.error("Gemini API Error:", error);
                    sloganOutputEl.innerHTML = `<p class="text-red-500 text-center pt-8 font-semibold">Error generating slogans:</p><p class="text-sm text-gray-500 text-center mt-2">${error.message}</p>`;
                } finally {
                    // Reset Loading State
                    generateBtn.disabled = false;
                    buttonTextEl.textContent = 'Generate 5 Slogans';
                    loadingSpinnerEl.classList.add('hidden');
                }
            }


            // --- Event Listener ---
            generateBtn.addEventListener('click', generateSlogans);
        })();
    </script>
</body>
</html>
