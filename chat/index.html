<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralized Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        /* Modern Dark Theme */
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: #1e1e1e; height: 100%; border-left: 1px solid #333; border-right: 1px solid #333; }
        
        header { padding: 15px; background: #272727; border-bottom: 1px solid #333; font-weight: bold; text-align: center; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { background: #333; padding: 8px 12px; border-radius: 6px; width: fit-content; max-width: 80%; word-wrap: break-word; }
        .msg small { display: block; font-size: 0.7em; color: #aaa; margin-bottom: 2px; }
        
        #input-area { padding: 15px; background: #272727; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #121212; color: white; }
        button { padding: 10px 20px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <header>Global Open Chat (No Database)</header>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Initialize Gun with a list of free public relay peers
    // These are community servers that help bounce messages between users
    const gun = Gun([
        'https://gun-manhattan.herokuapp.com/gun',
        'https://peer.wallie.io/gun' 
    ]);

    // 2. Create a specific room for your website
    // Change 'my-github-chat-unique-id' to something unique for your site!
    const chatNode = gun.get('my-github-chat-unique-id');

    // 3. Get User Name
    let username = localStorage.getItem('username');
    if (!username) {
        username = prompt("Enter your display name:") || "Guest";
        localStorage.setItem('username', username);
    }

    // 4. Send Message Function
    function sendMessage() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        
        if (text) {
            // Save data to the decentralized graph
            chatNode.set({
                name: username,
                text: text,
                time: Date.now()
            });
            input.value = "";
        }
    }

    // Allow pressing "Enter" to send
    document.getElementById("msgInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });

    // 5. Listen for updates (Real-time!)
    // .map() iterates over every message in the list
    // .once() ensures we process each message when it arrives
    chatNode.map().once((data, id) => {
        if (!data || !data.text) return; // Ignore empty data
        
        // Avoid duplicates in the UI (Gun sometimes sends data twice)
        if (document.getElementById(id)) return;

        const msgDiv = document.createElement("div");
        msgDiv.id = id; // Give element an ID to prevent duplicates
        msgDiv.className = "msg";
        
        const date = new Date(data.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        msgDiv.innerHTML = `<small>${data.name} • ${date}</small>${data.text}`;
        
        const messagesArea = document.getElementById("messages");
        messagesArea.appendChild(msgDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight; // Auto-scroll down
    });
</script>

</body>
</html>
