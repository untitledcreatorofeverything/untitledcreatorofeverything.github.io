<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator (Flash Model)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f8ff; }
        .card { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); }
        .btn-primary { transition: all 0.15s ease; background-color: #0d9488; }
        .btn-primary:hover { background-color: #0f766e; transform: translateY(-1px); }
        .loading-spin { border-color: #fff transparent transparent transparent; }
        .image-placeholder { background-color: #e2e8f0; border: 2px dashed #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-4xl bg-white rounded-xl p-6 md:p-10 card">
        <h1 class="text-3xl font-extrabold text-teal-700 mb-6 text-center border-b pb-3 border-teal-100">
            Gemini Flash AI Image Generator
        </h1>

        <!-- Status Box for API Key/Connection Messages -->
        <div id="statusBox" class="p-3 bg-blue-100 border border-blue-300 text-blue-700 rounded-lg text-sm mb-4">
            Model: **gemini-2.5-flash-image-preview** is active. If errors persist, a valid API key is required.
        </div>

        <!-- Input Form -->
        <div class="space-y-4">
            <!-- Prompt Input -->
            <div>
                <label for="prompt" class="block text-sm font-medium text-gray-700 mb-1">Detailed Image Prompt (e.g., "A futuristic city skyline at sunset, cyberpunk style, hyper-detailed")</label>
                <textarea id="prompt" rows="3" placeholder="Describe the image you want to create..."
                          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500"></textarea>
            </div>

            <!-- Generation Button -->
            <button id="generateBtn" class="w-full btn-primary text-white font-semibold py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-teal-300 flex items-center justify-center">
                <span id="buttonText">Generate Image</span>
                <div id="loadingSpinner" class="hidden w-5 h-5 border-4 border-white border-solid rounded-full loading-spin ml-3"></div>
            </button>
        </div>

        <!-- Output Display -->
        <div class="mt-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Generated Artwork</h2>
            <div id="outputContainer" class="flex justify-center items-center w-full">
                <div id="imagePlaceholder" class="image-placeholder rounded-lg w-full h-[350px] flex items-center justify-center">
                    <p class="text-gray-600 font-medium">Image will appear here.</p>
                </div>
                <img id="generatedImage" class="hidden w-full h-auto max-h-[70vh] object-contain rounded-lg shadow-xl" alt="Generated AI Image">
            </div>
            <p id="messageBox" class="text-center text-sm font-medium pt-3 h-6 text-red-500"></p>
        </div>
    </div>

    <script>
        (function() {
            const D = document;
            const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            
            // =========================================================================
            //  --- API CONFIGURATION ---
            //  The API_KEY is intentionally left empty. It will be provided by the 
            //  execution environment if available.
            // =========================================================================
            const API_KEY = "AIzaSyA9hc34gEh_1wdLj4AJfvUKdByNx7PoZw4"; 
            const MODEL_NAME = "gemini-2.5-flash-image-preview";
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
            // =========================================================================

            // --- UI Elements ---
            const promptEl = D.getElementById('prompt');
            const generateBtn = D.getElementById('generateBtn');
            const buttonTextEl = D.getElementById('buttonText');
            const loadingSpinnerEl = D.getElementById('loadingSpinner');
            const generatedImageEl = D.getElementById('generatedImage');
            const imagePlaceholderEl = D.getElementById('imagePlaceholder');
            const messageBoxEl = D.getElementById('messageBox');
            const statusBoxEl = D.getElementById('statusBox');

            // --- API UTILITY (Exponential Backoff) ---
            async function retryFetchWithBackoff(url, options, maxRetries = 5) {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(url, options);
                        
                        if (response.ok) {
                            return await response.json();
                        }
                        
                        // Handle 429 Rate Limit or 500/503 errors with retries
                        if (response.status === 429 || response.status >= 500) {
                            console.warn(`Attempt ${i + 1}/${maxRetries}: Retrying due to status ${response.status}.`);
                            if (i === maxRetries - 1) {
                                const errorText = await response.text();
                                throw new Error(`API failed after ${maxRetries} retries. Last status: ${response.status}. Response: ${errorText}`);
                            }
                            const delay = Math.pow(2, i) * 1000 + randInt(0, 1000); // 1s, 2s, 4s, ... + jitter
                            await new Promise(resolve => setTimeout(resolve, delay));
                        } else {
                            // Non-retryable error (e.g., 400 Bad Request, 403 Forbidden)
                            const errorText = await response.text();
                            throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                        }
                    } catch (error) {
                        console.error(`Attempt ${i + 1}/${maxRetries}: Network or pre-fetch error:`, error);
                        if (i === maxRetries - 1) throw error;
                        const delay = Math.pow(2, i) * 1000 + randInt(0, 1000);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            
            // --- Generation Logic ---
            async function generateImage() {
                const userPrompt = promptEl.value.trim();

                if (!userPrompt) {
                    messageBoxEl.textContent = 'Please enter a description for the image first!';
                    return;
                }
                
                // Set Loading State
                generateBtn.disabled = true;
                buttonTextEl.textContent = 'Generating...';
                loadingSpinnerEl.classList.remove('hidden');
                generatedImageEl.classList.add('hidden');
                messageBoxEl.textContent = 'Request sent. Awaiting response...';

                // Display loading placeholder
                imagePlaceholderEl.innerHTML = `
                    <div class="flex flex-col items-center">
                        <svg class="animate-spin h-8 w-8 text-teal-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p class="text-teal-600 mt-2">Creating visual concepts with Gemini Flash...</p>
                    </div>
                `;
                imagePlaceholderEl.classList.remove('hidden');
                

                try {
                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        generationConfig: {
                            responseModalities: ["IMAGE"]
                        },
                    };

                    const result = await retryFetchWithBackoff(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    // --- Parsing logic for generateContent image output ---
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                    if (!base64Data) {
                         // Check for error message in the response body if no data is found
                         const errorMsg = result?.candidates?.[0]?.finishReason === 'SAFETY' 
                                            ? 'Prompt blocked due to safety policy.' 
                                            : 'API did not return image data.';
                         throw new Error(errorMsg);
                    }
                    
                    const imageUrl = `data:image/png;base64,${base64Data}`;
                    
                    generatedImageEl.src = imageUrl;
                    imagePlaceholderEl.classList.add('hidden');
                    generatedImageEl.classList.remove('hidden');
                    messageBoxEl.textContent = 'Image generated successfully!';

                } catch (error) {
                    console.error("Image Generation Error:", error);
                    messageBoxEl.textContent = `Error: ${error.message}`;
                    // Show a failure message in the placeholder area
                    imagePlaceholderEl.innerHTML = `<p class="text-red-600 font-medium">Failed to generate image. Error: ${error.message.substring(0, 80)}...</p>`;
                    imagePlaceholderEl.classList.remove('hidden');
                    generatedImageEl.classList.add('hidden');

                } finally {
                    // Reset Loading State
                    generateBtn.disabled = false;
                    buttonTextEl.textContent = 'Generate Image';
                    loadingSpinnerEl.classList.add('hidden');
                }
            }


            // --- Event Listener ---
            generateBtn.addEventListener('click', generateImage);
        })();
    </script>
</body>
</html>
